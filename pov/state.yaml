version: 1
propositions:
- id: pov-retrieval-systems
  section: How retrieval/search/citation systems differ
  base_text: 'Each surface reaches the live web through a different retrieval and
    citation stack, so the same brand asset is discovered unevenly. Treat retrieval/index
    and crawler/index documentation as first-class evidence: it changes what "being
    found" means on that surface.'
  topics:
  - retrieval_index
  - citations_sources
  - crawler_index_policy
  bullets:
  - slot: crawler_index_policy
    text: It can take approximately 24 hours for OpenAI's systems to adjust for search
      results after a site's robots.txt update.
    claim_id: 0b187a5b6f942c1d2a3fcb12285238e5
    event_id: 9f7e8c586b05
    confidence: medium
    effective_at: '2026-09-19T16:44:43.507845Z'
    added_at: '2026-09-19T17:45:20.242520Z'
  last_reviewed: '2026-09-19T17:45:20.242520Z'
- id: pov-channel-prioritisation
  section: Channel/surface prioritisation by geography/category
  base_text: Prioritise by measured audience and referral behaviour, not by press
    volume. A surface matters when it moves a category's discovery, and that varies
    by geography; a regional surface can be commercially material before it is globally
    large.
  topics:
  - audience_usage
  - referrals_conversion
  bullets: []
  last_reviewed: null
- id: pov-commerce-ads
  section: 'Commercial surfaces: shopping, transaction and ads'
  base_text: Where AI surfaces carry shopping, transaction or ad placements, discovery
    is also a commercial pipeline. Optimise the product and feed data those surfaces
    consume, and measure the commerce path, not just the citation.
  topics:
  - commerce_ads
  bullets: []
  last_reviewed: null
- id: pov-measurement
  section: Measurement principles and known blind spots
  base_text: Measure discovery with evidence-derived confidence and explicit unknowns;
    a vendor's self-reported share is a study with a denominator and a window, not
    a fact. Known blind spots (unnamed samples, unpublished denominators, different
    geographies) are recorded, not smoothed over.
  topics:
  - measurement
  bullets: []
  last_reviewed: null
