# Discovery lane: open/free discovery sources used to find candidate URLs that are
# NOT in the curated registry above. Candidates are non-canonical until validated.
# Fetch health for these lives on the `discovery-fetch-infra` pseudo-source.
discovery_queries:
  - id: gdelt-ai-search-citations
    provider: gdelt
    query: '"AI search" OR "AI Overviews" OR "AI citations"'
    class_hint: editorial_discovery
    topics: [news_discovery, ai_search, citations]
  - id: gdelt-ai-referrals
    provider: gdelt
    query: '"AI referrals" OR "ChatGPT traffic" OR "answer engine optimization"'
    class_hint: editorial_discovery
    topics: [news_discovery, referrals, aeo]
  - id: bing-news-ai-visibility
    provider: bing_news
    query: 'AI search visibility study'
    class_hint: visibility_research
    topics: [news_discovery, ai_visibility]
  - id: bing-news-ai-referral-traffic
    provider: bing_news
    query: 'answer engine optimization'
    class_hint: market_telemetry
    topics: [news_discovery, referrals, aeo]
# NOTE (2026-09-16): Google News RSS is NOT used - news.google.com/robots.txt
# disallows /rss/search (verified). GDELT DOC API returns 429 when polled hard;
# its queries run through Scrapy AutoThrottle with a 30d window.

