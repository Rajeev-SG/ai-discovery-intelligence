name: web-ci

on:
  push:
    branches: ["**"]
    paths: ["web/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Uses Playwright webServer config for e2e (no manual npm start or curl loop).
jobs:
  observation-plane:
    name: observation-plane (typecheck, unit, build, e2e)
    runs-on: ubuntu-latest
    # Recorded-fixture mode: the evidence drill-down e2e runs structurally
    # against recorded data instead of silently skipping when no live API is
    # configured. Set EVIDENCE_API_URL to point the same suite at the real API.
    env:
      EVIDENCE_FIXTURE: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Registry invariants (python scaffold validator)
        working-directory: .
        run: |
          python -m pip install --quiet "PyYAML>=6,<7"
          python scripts/validate_scaffold.py

      - name: Vendored registry is current
        working-directory: .
        run: |
          python scripts/build_web_registry.py
          git diff --exit-code web/lib/generated-registry.json

      - name: Vendored POV artifact is current
        working-directory: .
        run: |
          python -m pip install --quiet "PyYAML>=6,<7" "pydantic>=2.9,<3"
          python scripts/build_web_pov.py
          git diff --exit-code web/lib/generated-pov.json

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end product proof
        # The reconciliation e2e (issue #47) needs a reachable evidence API;
        # set EVIDENCE_API_URL to point it at one. Against a dead/absent ledger
        # the spec skips with a clear message rather than failing on
        # infrastructure, so the merge gate never depends on a hardcoded host.
        env:
          EVIDENCE_API_URL: ${{ vars.EVIDENCE_API_URL }}
        run: npx playwright test

      - name: All-monitor-only implications state (issue #59 impl-004)
        # Proves the no-action state renders even when nothing is actionable, so an
        # all-monitor ledger never degrades to a blank "nothing here".
        env:
          EVIDENCE_FIXTURE: "all-monitor"
        run: |
          # The fixture is chosen at request time, so no rebuild is needed; the
          # Playwright webServer inherits this env.
          WEB_PORT=3110 EVIDENCE_FIXTURE=all-monitor npx playwright test e2e/implications.spec.ts -g "all-monitor" --project=desktop-chromium

      - name: No-backend degraded state (issue #61 F1)
        # Start the product with NO EVIDENCE_API_URL / EVIDENCE_FIXTURE and prove the
        # homepage renders the four explicit "unavailable" answers, not a confident
        # zero. Runs the landing spec's no-backend test in its real environment.
        env:
          NO_BACKEND_PROOF: "1"
          # Explicitly clear the job-level fixture so the server really has no API.
          EVIDENCE_FIXTURE: ""
          EVIDENCE_API_URL: ""
        run: |
          WEB_PORT=3109 npx playwright test e2e/landing.spec.ts -g "no backend" --project=desktop-chromium

      - name: Upload proof screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-plane-proof
          path: |
            web/proof
            web/test-results
          if-no-files-found: warn
          retention-days: 14
