name: claim-ledger-ci

on:
  push:
    branches: ["**"]
    paths: ["src/**", "scripts/**", "proof/**", "db/**", "tests/**", "deploy/**", "pov/**", "config/**", ".github/workflows/claim-ledger-ci.yml"]
  pull_request:
    paths: ["src/**", "scripts/**", "proof/**", "db/**", "tests/**", "deploy/**", "pov/**", "config/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: claim-ledger (extraction, integrity, tests, lint)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ai_discovery
          POSTGRES_PASSWORD: ai_discovery
          POSTGRES_DB: ai_discovery
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ai_discovery -d ai_discovery"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      AI_DISCOVERY_TEST_DATABASE_URL: postgresql://ai_discovery:ai_discovery@127.0.0.1:55432/ai_discovery
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Evidence-integrity scorecard (issue #29)
        run: uv run python scripts/build_integrity_scorecard.py

      - name: Run tests
        run: uv run pytest tests/ -q --tb=short

      - name: Instructor claim cycle end-to-end (capture → extraction → quote gate → ledger)
        run: uv run pytest tests/test_integration_cycle.py -q --tb=short

      - name: Postgres-backed persistence tests must run, not skip
        run: |
          output=$(uv run pytest tests/test_migration.py -q -rs --tb=short)
          echo "$output"
          if echo "$output" | grep -qi "skipped"; then
            echo "::error::Postgres-backed tests skipped; the CI database service is unavailable"
            exit 1
          fi

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Verify Instructor claim pipeline is importable and scheduleable
        run: |
          uv run python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from ai_discovery.pipeline import defs
          assert {s.name for s in defs.schedules} == {
              "daily_high_value_sources", "weekly_discovery_lane", "weekly_coverage_audit"
          }
          assets = {a.key.to_user_string() for a in defs.assets}
          assert "claims" in assets and "feed_items" in assets
          print("dagster defs OK:", sorted(assets))
          PY

      - name: Living POV is deterministic and gated (issue #7)
        run: |
          uv run python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from ai_discovery.pov import (
              PovProposition, PovState, apply_event, evaluate_event,
              load_policy, render_changelog,
          )
          import datetime as dt

          policy = load_policy()
          state = PovState(propositions=[PovProposition(
              id="ret", section="R", base_text="b",
              topics=["crawler_index_policy", "audience_usage"])])
          class E:
              id="e1"; title="A crawler policy change"; effective_from=None
              published_at=dt.datetime(2026,9,18,tzinfo=dt.UTC)
              observed_at=published_at
          claim = {"claim_id":"c1","topic":"crawler_index_policy","confidence":"medium",
                   "surfaces":["chatgpt"],"value":[{"value_text":"24"}]}
          d = apply_event(state=state, event=E(), claim=claim, policy=policy)
          assert d.adopt and d.proposition_id == "ret"
          assert len(state.changelog) == 1
          # A topic the proposition does not own yields no change.
          other = {"claim_id":"c2","topic":"commerce_ads","confidence":"medium",
                   "surfaces":["chatgpt"],"value":[{"value_text":"1"}]}
          d2 = evaluate_event(event=E(), claim=other, state=state, policy=policy)
          assert not d2.adopt
          assert "Before" in render_changelog(state)
          print("POV gate OK: 1 adopted, 1 correctly skipped")
          PY

      - name: Build the evidence-API image (issue #9)
        run: docker build -t ai-discovery-evidence-api:ci .

      - name: Upload proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claim-ledger-proof
          path: proof/claim_ledger/
          retention-days: 7
