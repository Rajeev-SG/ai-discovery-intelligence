name: claim-ledger-ci

on:
  push:
    branches: ["**"]
    paths: ["src/**", "scripts/**", "proof/**", "db/**", "tests/**", "deploy/**", "pov/**", "config/**", ".github/workflows/claim-ledger-ci.yml"]
  pull_request:
    paths: ["src/**", "scripts/**", "proof/**", "db/**", "tests/**", "deploy/**", "pov/**", "config/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: claim-ledger (extraction, integrity, tests, lint)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ai_discovery
          POSTGRES_PASSWORD: ai_discovery
          POSTGRES_DB: ai_discovery
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ai_discovery -d ai_discovery"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      AI_DISCOVERY_TEST_DATABASE_URL: postgresql://ai_discovery:ai_discovery@127.0.0.1:55432/ai_discovery
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Evidence-integrity scorecard (issue #29)
        run: uv run python scripts/build_integrity_scorecard.py

      - name: Run tests
        run: uv run pytest tests/ -q --tb=short

      - name: Instructor claim cycle end-to-end (capture → extraction → quote gate → ledger)
        run: uv run pytest tests/test_integration_cycle.py -q --tb=short

      - name: Postgres-backed persistence tests must run, not skip
        run: |
          output=$(uv run pytest tests/test_migration.py -q -rs --tb=short)
          echo "$output"
          if echo "$output" | grep -qi "skipped"; then
            echo "::error::Postgres-backed tests skipped; the CI database service is unavailable"
            exit 1
          fi

      - name: Production-dialect alias test must run, not skip
        # The alias-aware jsonb ?| filter only runs on Postgres; a silent skip would
        # let the alias fix regress on the production database alone (issue #58 F3).
        run: |
          output=$(uv run pytest tests/test_observation_api.py::test_alias_surface_filter_on_postgres_uses_the_jsonb_branch -q -rs --tb=short)
          echo "$output"
          if echo "$output" | grep -qi "skipped"; then
            echo "::error::Production-dialect alias test skipped; the Postgres service is unavailable"
            exit 1
          fi

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Verify Instructor claim pipeline is importable and scheduleable
        run: |
          uv run python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from ai_discovery.pipeline import defs
          assert {s.name for s in defs.schedules} == {
              "daily_high_value_sources", "weekly_discovery_lane", "weekly_coverage_audit"
          }
          assets = {a.key.to_user_string() for a in defs.assets}
          assert "claims" in assets and "feed_items" in assets
          print("dagster defs OK:", sorted(assets))
          PY

      - name: Living POV is deterministic and gated (issue #7)
        run: |
          uv run python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          import datetime as dt
          from ai_discovery.pov import (
              PovProposition, PovState, apply_event, evaluate_event, load_policy,
          )

          policy = load_policy()
          state = PovState(propositions=[PovProposition(
              id="ret", section="R", base_text="b",
              topics=["crawler_index_policy", "audience_usage"])])
          class E:
              def __init__(self, id): self.id=id; self.title="generic"; self.effective_from=None
              published_at=dt.datetime(2026,9,18,tzinfo=dt.UTC); observed_at=published_at
          claim = {"claim_id":"c1","topic":"crawler_index_policy","confidence":"medium",
                   "relationship":"new","status":"current","surfaces":["chatgpt"],
                   "value":[{"value_number":100.0,"value_text":"100"}],
                   "statement":"validated claim statement"}
          d = apply_event(state=state, event=E("e1"), claim=claim, policy=policy)
          assert d.adopt and d.proposition_id == "ret"
          assert len(state.changelog) == 1
          # Idempotent replay: the same event must not adopt again.
          d_replay = apply_event(state=state, event=E("e1"), claim=claim, policy=policy)
          assert not d_replay.adopt and len(state.changelog) == 1
          # A repeat of the incumbent value is not a material change.
          repeat = dict(claim, claim_id="c2", value=[{"value_number":100.0}])
          assert not evaluate_event(event=E("e2"), claim=repeat, state=state, policy=policy).adopt
          # A topic the proposition does not own yields no change.
          other = dict(claim, claim_id="c3", topic="commerce_ads")
          assert not evaluate_event(event=E("e3"), claim=other, state=state, policy=policy).adopt
          # Rejecting counterexample: a tiny relative change on an owned topic is
          # NOT material, while a large one is — the gate discriminates.
          from ai_discovery.pov import _magnitude
          tiny, _ = _magnitude(claim={"value":[{"value_number":24.1}]}, prior_value=24.0, policy=policy)
          large, _ = _magnitude(claim={"value":[{"value_number":96.0}]}, prior_value=24.0, policy=policy)
          assert tiny == 0.0 and large > policy.min_relative_change
          print("POV gate OK: adopt + idempotent replay + repeat + unowned topic + tiny-delta reject")
          PY

      - name: Build the evidence-API image (issue #9)
        run: docker build -t ai-discovery-evidence-api:ci .

      - name: Upload proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claim-ledger-proof
          path: proof/claim_ledger/
          retention-days: 7
