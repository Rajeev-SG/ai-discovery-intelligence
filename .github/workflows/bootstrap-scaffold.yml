name: Bootstrap scaffold retry

on:
  push:
    paths:
      - ".github/workflows/bootstrap-scaffold.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct scaffold
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/scaffold
          cat .bootstrap-parts/part_* | base64 -d > /tmp/scaffold.tgz
          tar -xzf /tmp/scaffold.tgz -C /tmp/scaffold
          rsync -a --delete --exclude='.git' /tmp/scaffold/ ./
      - name: Commit complete scaffold
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish complete AI Discovery Intelligence scaffold"
          git push origin main
