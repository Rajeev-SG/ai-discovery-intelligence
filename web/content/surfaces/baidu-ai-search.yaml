name: "Baidu AI Search"
vendor: "Baidu"
region: "China"
summary: "Baidu Search can cite websites in generated answers. Its Search Resource Platform gives site owners tools to check crawl access, submit updated URLs and look for citation data as it becomes available."
actions:
  - title: "Check the AI Traffic Analysis panel"
    description: "In Baidu Search Resource Platform, open AI流量分析 for your verified site. Check whether the rollout has reached your property before comparing citations, impressions and clicks."
  - title: "Diagnose a missing page with Baidu’s crawl tool"
    description: "Use 抓取诊断 in Search Resource Platform on the specific URL. If it is blocked, review the platform’s Robots tool for that URL before retrying."
  - title: "Submit the affected URL after correcting a cited page"
    description: "Use the Search Resource Platform’s URL submission tools when an old company or product page has been corrected or moved. Check whether the updated URL gets indexed."
