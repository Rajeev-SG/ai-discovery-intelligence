name: "Grok"
vendor: "xAI"
region: "global"
summary: "Grok can search both the web and X for current information and show live citations. That makes it possible to trace a claim to an ordinary web page or to a post on X."
actions:
  - title: "Check web and X sources separately"
    description: "Ask a recent brand or category question in Grok’s search mode. Open live citations and record which claims came from X posts and which came from publisher or brand pages."
  - title: "Check the original X post behind a fast-moving claim"
    description: "For a launch, recall or announcement surfaced from X, open the cited post and verify its date and account. Compare the wording with the brand’s own announcement."
  - title: "Use Grok’s research mode for a multi-source comparison"
    description: "Repeat a question that needs several sources in its deeper research mode. Compare the sources used and check whether the final answer preserves important differences between them."
mechanics:
  - label: "When it searches"
    description: "Grok has a search mode for live information and deeper research for questions that need more investigation."
  - label: "Where results come from"
    description: "xAI says Grok can search both the web and X and provide live citations."
