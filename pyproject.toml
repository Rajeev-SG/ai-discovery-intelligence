[project]
name = "ai-discovery-intelligence"
version = "0.0.1"
description = "Source-backed intelligence on consumer AI discovery surfaces"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0,<7",
    "pydantic>=2.9,<3",
    "SQLAlchemy>=2.0.36,<3",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.5,<3",
    "python-dateutil>=2.9,<3",
    "FastAPI>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "feedparser>=6.0,<7",
    "trafilatura>=2.0,<3",
    "scrapy>=2.12,<3",
    "dagster>=1.9,<2",
    "crawl4ai>=0.9.3,<0.10",
    "instructor>=1.17,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
