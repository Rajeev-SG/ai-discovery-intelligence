[project]
name = "ai-discovery-intelligence"
version = "0.0.1"
description = "Source-backed intelligence on consumer AI discovery surfaces"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PyYAML>=6.0,<7",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "SQLAlchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "FastAPI>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.27,<1",
    "feedparser>=6.0,<7",
    "trafilatura>=2.0,<3",
    "scrapy>=2.12,<3",
    "dagster>=1.9,<2",
    "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "respx>=0.21,<1",
    "ruff>=0.12,<1",
]

[project.scripts]
ai-discovery-ingest = "ai_discovery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_discovery"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "A", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency-injection idiom uses call-in-default (Depends(...)).
"src/ai_discovery/api.py" = ["B008"]
# Spider callbacks intentionally convert any provider/parse failure into a
# surfaced lane failure rather than crashing the crawl.
"src/ai_discovery/spiders.py" = ["BLE001"]
"src/ai_discovery/acquisition/extract.py" = ["BLE001"]
